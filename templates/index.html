<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskManager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>TaskManager</h1>
    <p>Gestión centralizada de tareas</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-titulo">Nueva tarea</h2>
      <form id="form-tarea" novalidate>
        <input type="hidden" id="tarea-id">
        <label>Nombre
          <input type="text" id="nombre" maxlength="100" placeholder="Ej. Elaborar documentación">
        </label>
        <label>Descripción
          <textarea id="descripcion" rows="3" placeholder="Detalles de la tarea"></textarea>
        </label>
        <div class="fila">
          <label>Prioridad
            <select id="prioridad">
              {% for p in prioridades %}<option value="{{ p }}" {{ 'selected' if p == 'Media' }}>{{ p }}</option>{% endfor %}
            </select>
          </label>
          <label>Estado
            <select id="estado">
              {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
            </select>
          </label>
        </div>
        <div class="acciones">
          <button type="submit" id="btn-guardar">Guardar tarea</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
        </div>
        <p id="mensaje" role="status"></p>
      </form>
    </section>

    <section class="card">
      <div class="encabezado-lista">
        <h2>Tareas</h2>
        <select id="filtro-estado" aria-label="Filtrar por estado">
          <option value="">Todas</option>
          {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
        </select>
      </div>
      <ul id="lista-tareas"></ul>
      <p id="vacio" hidden>No hay tareas registradas.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
